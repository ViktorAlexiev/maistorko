# Public demo: one origin for the site and the parts of Supabase the browser needs.
# Only /rest, /auth, /storage and /realtime reach Supabase; Studio, Mailpit, pg-meta
# and the auth admin API stay private.

upstream app {
    server host.docker.internal:3000;
}

upstream supabase {
    server host.docker.internal:54321;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Behind Cloudflare the real visitor IP is in CF-Connecting-IP
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

limit_req_zone $client_ip zone=auth:10m rate=20r/m;
limit_req_zone $client_ip zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The local CLI's sb_secret_ key is publicly known and grants full access: never accept it here
    if ($http_apikey ~* "sb_secret_")        { return 403; }
    if ($http_authorization ~* "sb_secret_") { return 403; }
    if ($args ~* "sb_secret_")               { return 403; }

    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /auth/v1/admin { return 403; }

    location /auth/v1/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://supabase;
    }

    location /rest/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://supabase;
    }

    location /storage/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://supabase;
    }

    location /realtime/v1/ {
        proxy_pass http://supabase;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else is the Next.js app. Host is passed through so Server Actions see the same origin.
    location / {
        proxy_pass http://app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

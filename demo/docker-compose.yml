# Public demo for friends: nginx (local port 8080, or DEMO_PORT) + a free Cloudflare quick tunnel (random https URL).
#   Start:   npm run demo:up      (prints the public URL)
#   Stop:    npm run demo:down
# Needs: local Supabase running, and the site built with `npm run build:demo` and started.
name: maistorko-demo

services:
  nginx:
    image: nginx:1.27-alpine
    # Local port. 80 is often taken on Windows by IIS (W3SVC); the tunnel doesn't need it either way.
    ports:
      - "${DEMO_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped
